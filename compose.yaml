services:
  dta:
    container_name: dta
    # DTA_TAG comes from ~/.config/dta/env via the systemd unit's EnvironmentFile.
    # Production leaves it unset (:latest); staging sets DTA_TAG=staging.
    image: ghcr.io/aalto-speech/dta-server:${DTA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - database:/data
      - hf-models:/hf/models
      - hf-cache:/hf/cache
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE: ${DATABASE:-/data/dta.db}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Internal address of the inference service (compose network, never published).
      ASA_URL: ${ASA_URL:-http://inference:8000}
      # Seconds the app waits for one scoring call. GPU scoring takes ~2-8 s;
      # CPU staging takes 30-60 s, so staging sets ASA_TIMEOUT=300.
      ASA_TIMEOUT: ${ASA_TIMEOUT:-60}

  # M-CASA speech scorer. No `ports:` on purpose - the /score endpoint is
  # unauthenticated and must stay reachable only from the compose network.
  # No `depends_on: condition: service_healthy` either: podman-compose does not
  # honour it, and the app already degrades correctly (503) while the model loads
  # (~20 s on GPU, ~10 min on CPU).
  inference:
    container_name: dta-inference
    image: ghcr.io/aalto-speech/dta-server/inference:${DTA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - asa-weights:/weights:ro
    environment:
      DTA_WEIGHTS_DIR: /weights
      # cuda on the GPU production host; staging (no GPU) sets DTA_DEVICE=cpu in env.
      DTA_DEVICE: ${DTA_DEVICE:-cuda}
      # Default bfloat16 reproduces the training/eval numerics from the model card.
      # Production sets DTA_AUTOCAST_DTYPE=float16 in ~/.config/dta/env: its GPU is a
      # Tesla P100 (Pascal, pre-Ampere) with no bf16 support, and fp32 would halve
      # throughput -- fp16 runs at native double rate on the P100. Parity vs the
      # staging-verified CPU path is checked before each release (see inference docs).
      DTA_AUTOCAST_DTYPE: ${DTA_AUTOCAST_DTYPE:-bfloat16}
      DTA_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DTA_WARMUP: "1"
    # Uncomment on GPU hosts (production). Left commented because podman-compose on a
    # GPU-less host handles nvidia device reservations unreliably.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  caddy:
    container_name: caddy
    image: docker.io/caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      # See Caddyfile for usage of these variables
      ACME_EMAIL: ${ACME_EMAIL:-}
      DOMAIN: ${DOMAIN:-localhost}
      UPSTREAM: ${UPSTREAM:-dta:8000} # [service|IP]:port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
      - caddy-logs:/var/log/caddy
    depends_on:
      - dta

volumes:
  database:
  caddy-config:
  caddy-data:
  caddy-logs:
    external: true
  hf-models:
    external: true
  hf-cache:
    external: true
  # Created by inference/deploy/fetch_weights.sh (~15.9 GB, not in any image).
  asa-weights:
    external: true
